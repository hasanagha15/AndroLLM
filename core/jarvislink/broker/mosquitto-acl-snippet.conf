# --- AndroLLM phone link (added 2026-11-22 by Jarvis, branch b-mqtt) ---------
# The AndroLLM app on the owner's phone receives tasks from Jarvis and answers them.
#   jarvis/phone/task     Jarvis -> phone   (AES-256-GCM envelope {v,kind,n,c})
#   jarvis/phone/result   phone  -> Jarvis  (AES-256-GCM envelope {v,kind,n,c})
#   jarvis/phone/status   phone  -> all     (retained online/offline, LWT)
# The phone may read tasks and write results/status only — it can never touch
# homeassistant/#, frigate/# or anything else on the bus.
# NOTE: the shared `piassist` user (readwrite #) can also write tasks and read
# results, but payloads are encrypted+authenticated end-to-end (key derived
# from task.key); the phone drops anything that does not decrypt.
# Reload:   docker exec mosquitto kill -HUP 1      (never `docker kill -s HUP`,
#           it marks the container as manually stopped -> no restart on boot)
# Rollback: sudo cp -a config.bak-androllm-<ts>/acl config.bak-androllm-<ts>/passwd config/
#           then the reload command above (copy INTO the bind-mounted dir; never rm it).
user androllm-phone
topic read jarvis/phone/task
topic write jarvis/phone/result
topic write jarvis/phone/status

# Jarvis side task publisher (jarvis-phone-task). Separate low-privilege user
# so the script never needs the piassist credentials.
user jarvis-phone-ctl
topic write jarvis/phone/task
topic read jarvis/phone/result
topic read jarvis/phone/status
